<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
</head>
<body>
    <div class="mobile-container">
        <div class="top-glow"></div>
        <div class="bottom-glow"></div>

        <div class="profile-box">
            <h1>Complete Profile</h1>
            <p class="subtitle">Add your details and upload a short intro video.</p>

            
            <div class="section-label">Your Name</div>
            <div class="name-row">
                <div class="input-box">
                    <input type="text" id="firstName" placeholder="First Name">
                </div>
                <div class="input-box">
                    <input type="text" id="lastName" placeholder="Last Name">
                </div>
            </div>

            
            <div class="section-label">Profile Picture</div>
            <div class="upload-section">
                <input type="file" id="profileImage" accept="image/*" hidden>
                <div class="image-preview-wrap" id="imagePreviewWrap" onclick="uploadProfileImage()">
                    <div class="image-placeholder" id="imagePlaceholder">
                        <span>📷</span>
                        <p>Tap to upload photo</p>
                    </div>
                    <img id="imagePreview" style="display:none;">
                    <div class="image-overlay" id="imageOverlay" style="display:none;">Change Photo</div>
                </div>
            </div>

            
            <div class="section-label">Short Intro Video <span class="badge">10 sec</span></div>
            <div class="upload-section">
                <input type="file" id="videoUpload" accept="video/*" hidden>
                <div class="video-preview-wrap">
                    <video id="cameraPreview" autoplay muted playsinline style="display:none;"></video>
                    <video id="recordedPreview" controls style="display:none;"></video>
                    <div class="video-placeholder" id="videoPlaceholder">
                        <span>🎬</span>
                        <p>No video selected</p>
                    </div>
                </div>
                
                <div class="timer-bar-wrap" id="timerBarWrap" style="display:none;">
                    <div class="timer-bar" id="timerBar"></div>
                    <span class="timer-text" id="timerText">10s</span>
                </div>
            </div>

            
            <div class="video-buttons">
                <button class="shoot-btn" id="shootBtn" onclick="handleShoot()">
                    🔴 Shoot
                </button>
                <button class="upload-btn" onclick="uploadVideo()">
                    📁 Upload
                </button>
            </div>

            
            <div class="upload-progress-wrap" id="uploadProgressWrap" style="display:none;">
                <div class="upload-progress-bar" id="uploadProgressBar"></div>
                <span class="upload-progress-text" id="uploadProgressText">Uploading... 0%</span>
            </div>

            
            <button class="live-btn" id="liveBtn" onclick="completeProfile()">
                Go Live 🚀
            </button>
        </div>
    </div>

    <script>
        let recordedVideoBlob   = null;
        let selectedProfileImage = null;
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording    = false;
        let timerInterval;
        let activeStream   = null;

        
        const userId = localStorage.getItem("userId");
        if (!userId) window.location.href = "/login-page";

        
        window.addEventListener("load", async () => {
            try {
                const res  = await fetch(`/get-user/${userId}`);
                const data = await res.json();
                if (data.success && data.user.profile_complete) {
                    
                    document.getElementById("firstName").value = data.user.first_name || "";
                    document.getElementById("lastName").value  = data.user.last_name  || "";

                    
                    if (data.user.profile_image) {
                        const preview = document.getElementById("imagePreview");
                        preview.src = data.user.profile_image;  
                        preview.style.display = "block";
                        document.getElementById("imagePlaceholder").style.display = "none";
                        document.getElementById("imageOverlay").style.display     = "flex";
                    }

                    
                    const rec = document.getElementById("recordedPreview");
                    rec.src = `/user-video/${userId}`;
                    rec.style.display = "block";
                    document.getElementById("videoPlaceholder").style.display = "none";

                    showToast("Existing profile loaded — update if needed", "info");
                }
            } catch(e) {
                
            }
        });

        
        function uploadProfileImage() {
            document.getElementById("profileImage").click();
        }

        document.getElementById("profileImage").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;

            
            if (file.size > 5 * 1024 * 1024) {
                showToast("Image must be under 5MB", "error");
                return;
            }

            selectedProfileImage = file;
            const preview = document.getElementById("imagePreview");
            preview.src   = URL.createObjectURL(file);
            preview.style.display = "block";
            document.getElementById("imagePlaceholder").style.display = "none";
            document.getElementById("imageOverlay").style.display     = "flex";
        });

        
        function uploadVideo() {
            document.getElementById("videoUpload").click();
        }

        document.getElementById("videoUpload").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;

            
            if (file.size > 50 * 1024 * 1024) {
                showToast("Video must be under 50MB", "error");
                return;
            }

            const tempVideo = document.createElement("video");
            tempVideo.src   = URL.createObjectURL(file);
            tempVideo.onloadedmetadata = () => {
                if (tempVideo.duration > 11) {
                    showToast("Video must be 10 seconds or less", "error");
                    return;
                }
                recordedVideoBlob = file;
                showVideoPreview(URL.createObjectURL(file));
                showToast("Video ready!", "success");
            };
        });

        function showVideoPreview(url) {
            document.getElementById("videoPlaceholder").style.display = "none";
            document.getElementById("cameraPreview").style.display    = "none";
            const rec = document.getElementById("recordedPreview");
            rec.src   = url;
            rec.style.display = "block";
        }

        
        async function handleShoot() {
            if (isRecording) stopRecording();
            else await startRecording();
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                activeStream = stream;

                const camPreview = document.getElementById("cameraPreview");
                document.getElementById("videoPlaceholder").style.display  = "none";
                document.getElementById("recordedPreview").style.display   = "none";
                camPreview.style.display = "block";
                camPreview.srcObject     = stream;

                recordedChunks = [];

                const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
                    ? "video/webm;codecs=vp9"
                    : MediaRecorder.isTypeSupported("video/webm")
                    ? "video/webm"
                    : "video/mp4";

                mediaRecorder = new MediaRecorder(stream, { mimeType });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob       = new Blob(recordedChunks, { type: mimeType });
                    recordedVideoBlob = blob;
                    showVideoPreview(URL.createObjectURL(blob));
                    stopAllTracks(stream);
                    clearTimerBar();
                    showToast("Video recorded!", "success");
                };

                mediaRecorder.start();
                isRecording = true;
                document.getElementById("shootBtn").innerHTML = "⏹ Stop";
                document.getElementById("shootBtn").classList.add("recording");

                startTimerBar(10);

                setTimeout(() => {
                    if (isRecording) stopRecording();
                }, 10000);

            } catch (error) {
                console.error(error);
                showToast("Camera permission denied", "error");
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
            isRecording = false;
            document.getElementById("shootBtn").innerHTML = "🔴 Shoot";
            document.getElementById("shootBtn").classList.remove("recording");
            clearTimerBar();
        }

        function stopAllTracks(stream) {
            if (stream) stream.getTracks().forEach(t => t.stop());
        }

        
        function startTimerBar(seconds) {
            const wrap = document.getElementById("timerBarWrap");
            const bar  = document.getElementById("timerBar");
            const text = document.getElementById("timerText");
            wrap.style.display = "flex";
            bar.style.width      = "100%";
            bar.style.transition = "none";
            let elapsed = 0;

            timerInterval = setInterval(() => {
                elapsed++;
                const left = seconds - elapsed;
                text.textContent  = left + "s";
                bar.style.transition = "width 1s linear";
                bar.style.width      = ((seconds - elapsed) / seconds * 100) + "%";
                if (elapsed >= seconds) clearInterval(timerInterval);
            }, 1000);
        }

        function clearTimerBar() {
            clearInterval(timerInterval);
            document.getElementById("timerBarWrap").style.display = "none";
        }

        
        async function completeProfile() {
            const firstName = document.getElementById("firstName").value.trim();
            const lastName  = document.getElementById("lastName").value.trim();

            if (!firstName || !lastName) {
                showToast("Please enter your full name", "error");
                return;
            }

            
            const imagePreviewSrc = document.getElementById("imagePreview").src;
            const hasExistingImage = imagePreviewSrc && imagePreviewSrc.includes("/user-image/");

            if (!selectedProfileImage && !hasExistingImage) {
                showToast("Please upload a profile picture", "error");
                return;
            }

            
            const recSrc = document.getElementById("recordedPreview").src;
            const hasExistingVideo = recSrc && recSrc.includes("/user-video/");

            if (!recordedVideoBlob && !hasExistingVideo) {
                showToast("Please add a short intro video", "error");
                return;
            }

            
            if (!selectedProfileImage && !recordedVideoBlob && hasExistingImage && hasExistingVideo) {
                showToast("Profile up to date!", "success");
                setTimeout(() => window.location.href = "/landing-page", 800);
                return;
            }

            const btn = document.getElementById("liveBtn");
            btn.textContent = "Saving...";
            btn.disabled    = true;

            const formData = new FormData();
            formData.append("first_name", firstName);
            formData.append("last_name",  lastName);

            if (selectedProfileImage) {
                formData.append("profile_image", selectedProfileImage);
            } else {
                
                const imgRes  = await fetch(`/user-image/${userId}`);
                const imgBlob = await imgRes.blob();
                formData.append("profile_image", imgBlob, "profile.jpg");
            }

            if (recordedVideoBlob) {
                formData.append("short_video", recordedVideoBlob, "video.webm");
            } else {
                
                const vidRes  = await fetch(`/user-video/${userId}`);
                const vidBlob = await vidRes.blob();
                formData.append("short_video", vidBlob, "video.webm");
            }

            
            try {
                await uploadWithProgress(`/complete-profile/${userId}`, formData);
                showToast("Profile saved! Going live...", "success");
                setTimeout(() => window.location.href = "/landing-page", 900);
            } catch (error) {
                showToast(error.message || "Server Error", "error");
                btn.textContent = "Go Live 🚀";
                btn.disabled    = false;
                hideProgress();
            }
        }

        
        function uploadWithProgress(url, formData) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener("progress", (e) => {
                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 100);
                        showProgress(pct);
                    }
                });

                xhr.addEventListener("load", () => {
                    hideProgress();
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (data.success) resolve(data);
                        else reject(new Error(data.message));
                    } catch(e) {
                        reject(new Error("Server Error"));
                    }
                });

                xhr.addEventListener("error", () => {
                    hideProgress();
                    reject(new Error("Network Error"));
                });

                xhr.open("POST", url);
                xhr.send(formData);
            });
        }

        function showProgress(pct) {
            const wrap = document.getElementById("uploadProgressWrap");
            const bar  = document.getElementById("uploadProgressBar");
            const text = document.getElementById("uploadProgressText");
            wrap.style.display  = "block";
            bar.style.width     = pct + "%";
            text.textContent    = `Saving to database... ${pct}%`;
        }

        function hideProgress() {
            document.getElementById("uploadProgressWrap").style.display = "none";
        }

        
        function showToast(msg, type) {
            const old = document.querySelector(".toast");
            if (old) old.remove();
            const toast = document.createElement("div");
            toast.className  = "toast " + (type || "");
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add("show"), 10);
            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 400);
            }, 2800);
        }
    </script>
</body>
</html>
